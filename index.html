<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- MÃ NGỤY TRANG LINK PREVIEW ĐỂ LỪA BẠN BÈ -->
    <meta property="og:title" content="Trải nghiệm Âm Thanh 8D">
    <meta property="og:description" content="Đeo tai nghe và bấm để nghe thử bản nhạc cực chill này nhé.">
    <!-- Ảnh preview sẽ hiện ra là một cái micro/tai nghe -->
    <meta property="og:image" content="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80">
    <meta name="theme-color" content="#000000">
    
    <title>Trải nghiệm Âm Thanh 8D</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; color: white; font-family: sans-serif; cursor: pointer; user-select: none; }
        #startScreen { text-align: center; z-index: 10; }
        #startScreen h1 { font-size: 24px; margin-bottom: 10px; }
        #startScreen p { font-size: 14px; opacity: 0.7; }
        #jumpscareContainer { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; }
        #jumpscareImage { width: 100%; height: 100%; object-fit: cover; }
        .flash { animation: flash 0.1s infinite; }
        .shake { animation: shake 0.1s infinite; }
        @keyframes flash { 0% { filter: invert(0); } 50% { filter: invert(1); } 100% { filter: invert(0); } }
        @keyframes shake { 0% { transform: translate(15px, 15px) scale(1.1); } 25% { transform: translate(-15px, 15px) scale(1.1); } 50% { transform: translate(-15px, -15px) scale(1.1); } 75% { transform: translate(15px, -15px) scale(1.1); } 100% { transform: translate(15px, 15px) scale(1.1); } }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>▶ Bấm vào đây để nghe nhạc</h1>
        <p>(Khuyên dùng tai nghe để có trải nghiệm tốt nhất)</p>
    </div>

    <div id="jumpscareContainer">
        <!-- Thẻ ảnh để trống src, chống bot đọc trộm -->
        <img id="jumpscareImage" alt="">
    </div>

    <script>
        // Tải ngầm ảnh mặt cậu và âm thanh để khi hù không bị giật/lag
        const preloadedImg = new Image();
        preloadedImg.src = "image_406add.jpg";

        const sound = new Audio("Jumpscare Sound Effect - GamingSoundEffects.mp3");
        sound.preload = "auto";

        document.body.addEventListener('click', function() {
            // Phóng to toàn màn hình
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) { docElm.requestFullscreen(); }
            else if (docElm.webkitRequestFullscreen) { docElm.webkitRequestFullscreen(); }

            // Ẩn màn hình lừa đảo
            document.getElementById('startScreen').style.display = 'none';
            
            // Hiện jumpscare
            const container = document.getElementById('jumpscareContainer');
            const imgElement = document.getElementById('jumpscareImage');
            
            imgElement.src = preloadedImg.src; // Đưa ảnh của cậu vào đúng lúc này
            container.style.display = 'block';
            container.classList.add('flash', 'shake');

            // Bật tiếng la hét
            sound.play().catch(e => console.log("Lỗi:", e));
        });
    </script>
</body>
</html>
