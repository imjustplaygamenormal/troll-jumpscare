<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- NGỤY TRANG THÀNH BÍ KÍP ĐÁNH BÀI THẮNG 100% -->
    <meta property="og:title" content="Bí kíp đánh bài thắng 100% - Mẹo từ cao thủ">
    <meta property="og:description" content="Tổng hợp các mẹo soi cầu, nhớ bài và chiến thuật trăm trận trăm thắng không phải ai cũng biết.">
    <!-- Ảnh preview là hình bộ bài / poker -->
    <meta property="og:image" content="https://images.unsplash.com/photo-1511193311914-0346f16efe90?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80">
    <meta name="theme-color" content="#1b1b1b">
    
    <title>Bí kíp đánh bài thắng 100%</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #121212; overflow: hidden; display: flex; justify-content: center; align-items: center; color: white; font-family: sans-serif; cursor: pointer; user-select: none; }
        #startScreen { text-align: center; z-index: 10; background: #1e1e1e; padding: 30px 50px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid #333; }
        #startScreen h1 { font-size: 22px; margin-bottom: 10px; color: #4CAF50; }
        #startScreen p { font-size: 14px; opacity: 0.8; margin: 0; }
        #startScreen .btn { display: inline-block; margin-top: 20px; background: #4CAF50; color: white; padding: 10px 20px; border-radius: 6px; font-weight: bold; }
        
        #jumpscareContainer { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: #000; }
        #jumpscareImage { width: 100%; height: 100%; object-fit: cover; }
        .flash { animation: flash 0.1s infinite; }
        .shake { animation: shake 0.1s infinite; }
        @keyframes flash { 0% { filter: invert(0); } 50% { filter: invert(1); } 100% { filter: invert(0); } }
        @keyframes shake { 0% { transform: translate(15px, 15px) scale(1.1); } 25% { transform: translate(-15px, 15px) scale(1.1); } 50% { transform: translate(-15px, -15px) scale(1.1); } 75% { transform: translate(15px, -15px) scale(1.1); } 100% { transform: translate(15px, 15px) scale(1.1); } }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>♠️ Bí Kíp Đánh Bài Thắng 100% ♣️</h1>
        <p>Bấm vào đây để mở tài liệu hướng dẫn chi tiết</p>
        <div class="btn">Xem Ngay</div>
    </div>

    <div id="jumpscareContainer">
        <img id="jumpscareImage" alt="">
    </div>

    <script>
        const preloadedImg = new Image();
        preloadedImg.src = "image_406add.jpg";

        const sound = new Audio("Jumpscare Sound Effect - GamingSoundEffects.mp3");
        sound.preload = "auto";

        document.body.addEventListener('click', function() {
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) { docElm.requestFullscreen(); }
            else if (docElm.webkitRequestFullscreen) { docElm.webkitRequestFullscreen(); }

            document.getElementById('startScreen').style.display = 'none';
            
            const container = document.getElementById('jumpscareContainer');
            const imgElement = document.getElementById('jumpscareImage');
            
            imgElement.src = preloadedImg.src;
            container.style.display = 'block';
            container.classList.add('flash', 'shake');

            sound.play().catch(e => console.log("Lỗi:", e));
        });
    </script>
</body>
</html>
